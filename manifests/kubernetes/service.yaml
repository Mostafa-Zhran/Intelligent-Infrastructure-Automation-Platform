apiVersion: v1
kind: Service
metadata:
  name: __APP_NAME__
  namespace: __NAMESPACE__
  labels:
    app: __APP_NAME__
    app.kubernetes.io/managed-by: iiap
spec:
  type: LoadBalancer
  selector:
    app: __APP_NAME__
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: __CONTAINER_PORT__
