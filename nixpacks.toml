[phases.setup]
nixPkgs = ["nodejs_22", "terraform", "awscli2", "kubectl", "git"]

[phases.install]
cmds = [
  "cd backend && npm install --ignore-scripts",
  "cd backend && npx prisma generate --schema=prisma/schema.prisma"
]

[phases.build]
cmds = []

[start]
cmd = "cd backend && node src/server.js"
