name: IIAP Deployment Pipeline

# ==============================================================================
# GitHub Actions CI/CD Pipeline — Intelligent Infrastructure Automation Platform
# Replaces Jenkins with native GitHub Actions Workflow Dispatch
# Implements: PIPE-04 (Checkout), PIPE-05 (Build), PIPE-06 (Terraform), PIPE-07 (Deploy), STAT-01 (Status)
# ==============================================================================

on:
  workflow_dispatch:
    inputs:
      project_id:
        description: 'Unique Project UUID'
        required: true
        type: string
      deployment_id:
        description: 'Unique Deployment UUID'
        required: true
        type: string
      repo_url:
        description: 'Git clone repository URL'
        required: false
        type: string
      repo_full_name:
        description: 'Target repository full name (owner/repo)'
        required: false
        type: string
      branch:
        description: 'Target branch name'
        required: true
        default: 'main'
        type: string
      commit_sha:
        description: 'Exact 40-character commit SHA'
        required: true
        type: string
      environment:
        description: 'Target deployment environment'
        required: true
        default: 'development'
        type: string
      dockerfile_path:
        description: 'Relative path to Dockerfile'
        required: false
        default: 'Dockerfile'
        type: string
      replicas:
        description: 'Number of pod replicas'
        required: false
        default: '1'
        type: string
      correlation_id:
        description: 'Distributed tracing correlation ID'
        required: false
        type: string
      callback_url:
        description: 'Backend status webhook callback URL'
        required: true
        type: string

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: deploy-${{ inputs.project_id }}-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & Deploy to ${{ inputs.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ------------------------------------------------------------------------
      # 0. Initialize & Notify Backend that Deployment is RUNNING
      # ------------------------------------------------------------------------
      - name: Notify Backend Pipeline Running
        env:
          CALLBACK_URL: ${{ inputs.callback_url }}
          WORKER_API_KEY: ${{ secrets.WORKER_API_KEY }}
        run: |
          STARTED_AT=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          echo "STARTED_AT=${STARTED_AT}" >> $GITHUB_ENV
          echo "=========================================================="
          echo " Starting IIAP GitHub Actions Deployment Pipeline"
          echo " Deployment ID:  ${{ inputs.deployment_id }}"
          echo " Project ID:     ${{ inputs.project_id }}"
          echo " Commit SHA:     ${{ inputs.commit_sha }}"
          echo " Environment:    ${{ inputs.environment }}"
          echo " Correlation ID: ${{ inputs.correlation_id }}"
          echo " Started At:     ${STARTED_AT}"
          echo "=========================================================="

          if [ -n "${CALLBACK_URL}" ] && [ -n "${WORKER_API_KEY}" ]; then
            curl -s -S -X POST "${CALLBACK_URL}" \
              -H "Content-Type: application/json" \
              -H "X-Worker-Api-Key: ${WORKER_API_KEY}" \
              -d "{\"status\":\"RUNNING\",\"startedAt\":\"${STARTED_AT}\"}" || echo "Warning: Backend callback failed."
          fi

      # ------------------------------------------------------------------------
      # 0.1 Checkout Platform Infrastructure & Scripts
      # ------------------------------------------------------------------------
      - name: Checkout Platform Infrastructure Code
        uses: actions/checkout@v4
        with:
          path: .
          fetch-depth: 1

      # ------------------------------------------------------------------------
      # 1. PIPE-04 — Secure Repository Checkout (User Application)
      # ------------------------------------------------------------------------
      - name: PIPE-04 — Derive Target Repository Name
        id: target_repo
        run: |
          TARGET="${{ inputs.repo_full_name }}"
          if [ -z "${TARGET}" ] && [ -n "${{ inputs.repo_url }}" ]; then
            TARGET=$(echo "${{ inputs.repo_url }}" | sed -E 's|https://github.com/||' | sed -E 's|\.git$||')
          fi
          if [ -z "${TARGET}" ]; then
            TARGET="${{ github.repository }}"
          fi
          echo "target_repo=${TARGET}" >> $GITHUB_OUTPUT
          echo "Target user application repository: ${TARGET}"

      - name: PIPE-04 — Checkout Exact Commit SHA
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.target_repo.outputs.target_repo }}
          ref: ${{ inputs.commit_sha }}
          path: workspace
          fetch-depth: 1

      - name: PIPE-04 — Verify Commit Integrity & Dockerfile
        run: |
          cd workspace
          CHECKED_OUT_SHA=$(git rev-parse HEAD)
          echo "Requested SHA:    ${{ inputs.commit_sha }}"
          echo "Checked out SHA:  ${CHECKED_OUT_SHA}"

          if [ "${CHECKED_OUT_SHA}" != "${{ inputs.commit_sha }}" ]; then
            echo "SECURITY ERROR: Checked-out commit SHA does not match expected SHA!" >&2
            exit 1
          fi

          DOCKERFILE="${{ inputs.dockerfile_path }}"
          if [ ! -f "${DOCKERFILE}" ]; then
            echo "ERROR: Dockerfile not found at '${DOCKERFILE}'" >&2
            exit 1
          fi
          echo "✓ Verified commit integrity and Dockerfile presence at: ${DOCKERFILE}"

      # ------------------------------------------------------------------------
      # 2. PIPE-05 — Docker Build and Image Publishing
      # ------------------------------------------------------------------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Derive Image Name and Tags
        id: meta
        run: |
          IMAGE_NAME="ghcr.io/${{ github.repository_owner }}/app-${{ inputs.project_id }}"
          IMAGE_NAME=$(echo "${IMAGE_NAME}" | tr '[:upper:]' '[:lower:]')
          SHORT_SHA=$(echo "${{ inputs.commit_sha }}" | cut -c1-8)
          TAG_SHA="${IMAGE_NAME}:${SHORT_SHA}"
          TAG_DEPLOY="${IMAGE_NAME}:deploy-${{ inputs.deployment_id }}"
          TAG_LATEST="${IMAGE_NAME}:${{ inputs.environment }}"

          echo "image_name=${IMAGE_NAME}" >> $GITHUB_OUTPUT
          echo "tag_sha=${TAG_SHA}" >> $GITHUB_OUTPUT
          echo "tag_deploy=${TAG_DEPLOY}" >> $GITHUB_OUTPUT
          echo "tag_latest=${TAG_LATEST}" >> $GITHUB_OUTPUT

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: PIPE-05 — Build and Push Container Image
        uses: docker/build-push-action@v5
        with:
          context: workspace
          file: workspace/${{ inputs.dockerfile_path }}
          push: true
          tags: |
            ${{ steps.meta.outputs.tag_sha }}
            ${{ steps.meta.outputs.tag_deploy }}
            ${{ steps.meta.outputs.tag_latest }}
          labels: |
            org.opencontainers.image.revision=${{ inputs.commit_sha }}
            io.iiap.project_id=${{ inputs.project_id }}
            io.iiap.deployment_id=${{ inputs.deployment_id }}
            io.iiap.environment=${{ inputs.environment }}

      # ------------------------------------------------------------------------
      # 3. ANS-01 — Ansible Server Configuration Stage
      # ------------------------------------------------------------------------
      - name: ANS-01 — Ansible Server Configuration
        env:
          ANSIBLE_PLAYBOOK: "playbooks/site.yml"
          DEPLOYMENT_ID: ${{ inputs.deployment_id }}
          CORRELATION_ID: ${{ inputs.correlation_id }}
          ENVIRONMENT: ${{ inputs.environment }}
          CALLBACK_URL: ${{ inputs.callback_url }}
          WORKER_API_KEY: ${{ secrets.WORKER_API_KEY }}
          # SSH key for Ansible comes from repository secret — never from user input
          ANSIBLE_PRIVATE_KEY: ${{ secrets.ANSIBLE_SSH_PRIVATE_KEY }}
        run: |
          # Install Ansible if not already present on runner
          if ! command -v ansible-playbook &> /dev/null; then
            pip install --quiet ansible
          fi

          # If SSH key provided, configure it for Ansible
          if [ -n "${ANSIBLE_PRIVATE_KEY}" ]; then
            mkdir -p ~/.ssh
            echo "${ANSIBLE_PRIVATE_KEY}" > ~/.ssh/ansible_deploy_key
            chmod 600 ~/.ssh/ansible_deploy_key
            export ANSIBLE_PRIVATE_KEY_FILE=~/.ssh/ansible_deploy_key
          fi

          chmod +x ansible/scripts/run-ansible-stage.sh
          ./ansible/scripts/run-ansible-stage.sh

      # ------------------------------------------------------------------------
      # 4. PIPE-06 — Terraform Infrastructure Stage
      # ------------------------------------------------------------------------
      - name: Set up Terraform CLI
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.0
          terraform_wrapper: false

      - name: PIPE-06 — Terraform Plan/Apply Infrastructure
        env:
          TF_WORKING_DIR: "terraform/environments/dev"
          TF_COMMAND: ${{ inputs.environment == 'production' && 'apply' || 'plan-only' }}
          DEPLOYMENT_ID: ${{ inputs.deployment_id }}
          CORRELATION_ID: ${{ inputs.correlation_id }}
          CALLBACK_URL: ${{ inputs.callback_url }}
          WORKER_API_KEY: ${{ secrets.WORKER_API_KEY }}
          # AWS credentials — injected from repository secrets, never from user input
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
        run: |
          if [ -f "terraform/scripts/run-terraform-stage.sh" ]; then
            chmod +x terraform/scripts/run-terraform-stage.sh
            terraform/scripts/run-terraform-stage.sh
          else
            echo "Terraform stage script not found — skipping (dev mode)."
          fi

      # ------------------------------------------------------------------------
      # 5. PIPE-07 — Kubernetes Deployment Stage
      # ------------------------------------------------------------------------
      - name: PIPE-07 — Kubernetes Deployment Rollout
        id: k8s_deploy
        env:
          APP_NAME: "app-${{ inputs.project_id }}"
          NAMESPACE: "app-${{ inputs.environment }}"
          IMAGE: "${{ steps.meta.outputs.tag_sha }}"
          REPLICAS: "${{ inputs.replicas || '1' }}"
          PORT: "3000"
          HOST: "app-${{ inputs.project_id }}.${{ inputs.environment }}.example.com"
          TIMEOUT_SECONDS: "180"
          KUBECONFIG_SECRET: "${{ secrets.KUBECONFIG }}"
        run: |
          # If KUBECONFIG secret is provided, configure runner context
          if [ -n "${KUBECONFIG_SECRET}" ]; then
            mkdir -p ~/.kube
            echo "${KUBECONFIG_SECRET}" > ~/.kube/config
            chmod 600 ~/.kube/config
            export KUBECONFIG=~/.kube/config
          fi

          chmod +x k8s/scripts/render-and-deploy.sh
          ./k8s/scripts/render-and-deploy.sh

      # ------------------------------------------------------------------------
      # 4. Status Callback on Success (STAT-01)
      # ------------------------------------------------------------------------
      - name: Notify Backend Deployment Succeeded
        if: success()
        env:
          CALLBACK_URL: ${{ inputs.callback_url }}
          WORKER_API_KEY: ${{ secrets.WORKER_API_KEY }}
        run: |
          FINISHED_AT=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          echo "✓ Pipeline execution completed successfully at ${FINISHED_AT}"

          if [ -n "${CALLBACK_URL}" ] && [ -n "${WORKER_API_KEY}" ]; then
            curl -s -S -X POST "${CALLBACK_URL}" \
              -H "Content-Type: application/json" \
              -H "X-Worker-Api-Key: ${WORKER_API_KEY}" \
              -d "{\"status\":\"SUCCEEDED\",\"startedAt\":\"${STARTED_AT}\",\"finishedAt\":\"${FINISHED_AT}\"}" || true
          fi

      # ------------------------------------------------------------------------
      # 5. Status Callback on Failure (STAT-01 & PIPE-08)
      # ------------------------------------------------------------------------
      - name: Notify Backend Deployment Failed
        if: failure()
        env:
          CALLBACK_URL: ${{ inputs.callback_url }}
          WORKER_API_KEY: ${{ secrets.WORKER_API_KEY }}
        run: |
          FINISHED_AT=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          echo "✗ Pipeline failed at ${FINISHED_AT}"

          if [ -n "${CALLBACK_URL}" ] && [ -n "${WORKER_API_KEY}" ]; then
            curl -s -S -X POST "${CALLBACK_URL}" \
              -H "Content-Type: application/json" \
              -H "X-Worker-Api-Key: ${WORKER_API_KEY}" \
              -d "{\"status\":\"FAILED\",\"errorMessage\":\"GitHub Actions pipeline failed during execution. Check workflow run logs for details.\",\"startedAt\":\"${STARTED_AT}\",\"finishedAt\":\"${FINISHED_AT}\"}" || true
          fi
