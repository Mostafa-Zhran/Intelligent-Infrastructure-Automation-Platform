---
# ==============================================================================
# Group Variables — All Hosts
# Applied to every host in the inventory.
# SECURITY: No secrets stored here — secrets come from the CI secrets store.
# ==============================================================================

# ── Connection & SSH ─────────────────────────────────────────────────────────
ansible_ssh_common_args: >-
  -o StrictHostKeyChecking=yes
  -o BatchMode=yes
  -o ConnectTimeout=20

# ── Package Management ────────────────────────────────────────────────────────
# Controls which packages are considered approved for installation
approved_package_manager: auto   # auto | apt | yum | dnf

# ── IIAP Platform Metadata ───────────────────────────────────────────────────
iiap_project: "intelligent-infrastructure-automation-platform"
iiap_managed_by: "ansible"

# ── Log Redaction Patterns ────────────────────────────────────────────────────
# Tasks MUST NOT output these values; redaction is enforced at the pipeline level
sensitive_env_vars:
  - GITHUB_TOKEN
  - AWS_SECRET_ACCESS_KEY
  - KUBECONFIG
  - WORKER_API_KEY
  - DATABASE_URL
