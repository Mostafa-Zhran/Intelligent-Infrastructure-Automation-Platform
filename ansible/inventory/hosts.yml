---
# ==============================================================================
# Server-managed Ansible inventory.
# SECURITY: Only hosts defined here by the operations team are reachable.
# No user-supplied host addresses, groups, or inventory files are accepted.
# ==============================================================================

all:
  vars:
    # Global timeouts applied to all plays
    ansible_timeout: 30
    ansible_connection_timeout: 20

  children:

    # -------------------------------------------------------------------------
    # Build Agents — hosts that run Docker builds in the GitHub Actions runner
    # -------------------------------------------------------------------------
    build_agents:
      vars:
        ansible_user: "{{ lookup('env', 'ANSIBLE_BUILD_USER') | default('ubuntu') }}"
        ansible_become: false
        agent_base_packages:
          - curl
          - git
          - unzip
          - jq
      hosts:
        # Populated at provisioning time via Terraform outputs.
        # The pattern below is replaced by the render-inventory.sh script.
        # build-agent-01:
        #   ansible_host: "{{ BUILD_AGENT_IP }}"

    # -------------------------------------------------------------------------
    # Kubernetes Worker Prep — baseline hardening before EKS node join
    # -------------------------------------------------------------------------
    k8s_nodes:
      vars:
        ansible_user: "{{ lookup('env', 'ANSIBLE_K8S_USER') | default('ec2-user') }}"
        ansible_become: true
        ansible_become_method: sudo
      hosts:
        # Populated dynamically from Terraform output during pipeline execution.
        # k8s-node-01:
        #   ansible_host: "{{ K8S_NODE_IP_1 }}"
