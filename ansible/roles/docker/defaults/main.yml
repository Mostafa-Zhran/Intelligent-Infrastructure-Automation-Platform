---
# defaults/main.yml — docker role
# Approved versions. NOT overridable from user input.

docker_ce_version: "5:26.1.4-1~ubuntu.22.04~jammy"

# Server-approved daemon configuration
docker_daemon_config:
  log-driver: json-file
  log-opts:
    max-size: "50m"
    max-file: "5"
  storage-driver: overlay2
  live-restore: true
  userland-proxy: false
  no-new-privileges: true

# Runner user to add to docker group (set by CI pipeline context, never user input)
docker_runner_user: "ubuntu"
