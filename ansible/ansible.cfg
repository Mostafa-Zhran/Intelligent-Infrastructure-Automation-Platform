# ==============================================================================
# Ansible Configuration — Intelligent Infrastructure Automation Platform (IIAP)
# ==============================================================================
# This ansible.cfg is committed to version control.
# Server-managed only — no user-supplied overrides accepted at runtime.
# ==============================================================================

[defaults]
# Inventory is loaded from the approved server-managed file only
inventory           = inventory/hosts.yml
roles_path          = roles:../roles:ansible/roles

# Output and logging controls
stdout_callback     = yaml
callback_whitelist  = timer, profile_tasks
display_skipped_hosts = false
display_ok_hosts    = true
any_errors_fatal    = true

# Security hardening
host_key_checking   = true
retry_files_enabled = false
remote_tmp          = /tmp/.ansible/tmp
local_tmp           = /tmp/.ansible/local-tmp

# Timeouts (seconds)
timeout             = 30
gather_timeout      = 30

# Fact caching to reduce redundant remote calls
gathering           = smart
fact_caching        = memory
fact_caching_timeout = 3600

# SSH connection settings
pipelining          = true

[privilege_escalation]
become              = false
become_method       = sudo

[ssh_connection]
ssh_args            = -C -o ControlMaster=auto -o ControlPersist=60s -o BatchMode=yes -o StrictHostKeyChecking=yes
pipelining          = true
control_path_dir    = /tmp/.ansible/cp
