---
# ==============================================================================
# ANS-01 — Build Agent Bootstrap Playbook
# Installs Docker, Git, AWS CLI on approved build agent hosts only.
# ==============================================================================
- name: "ANS-01 | Bootstrap Build Agents"
  hosts: build_agents
  gather_facts: true
  any_errors_fatal: true

  pre_tasks:
    - name: "STAGE | Record stage start time"
      set_fact:
        stage_started_at: "{{ ansible_date_time.iso8601 }}"
      tags: always

    - name: "STAGE | Print pipeline context"
      debug:
        msg:
          - "======================================================"
          - " ANS-01 — Build Agent Bootstrap"
          - " Host:           {{ inventory_hostname }}"
          - " Deployment ID:  {{ deployment_id | default('N/A') }}"
          - " Correlation ID: {{ correlation_id | default('N/A') }}"
          - " Environment:    {{ environment | default('dev') }}"
          - " Started At:     {{ stage_started_at }}"
          - "======================================================"
      no_log: false
      tags: always

  roles:
    - role: common
      tags: [common]
    - role: docker
      tags: [docker]

  post_tasks:
    - name: "STAGE | Record stage completion"
      set_fact:
        stage_finished_at: "{{ ansible_date_time.iso8601 }}"
      tags: always

    - name: "STAGE | Print completion summary"
      debug:
        msg:
          - "Build Agent bootstrap completed on {{ inventory_hostname }}"
          - "Started: {{ stage_started_at }}  Finished: {{ stage_finished_at }}"
      tags: always
