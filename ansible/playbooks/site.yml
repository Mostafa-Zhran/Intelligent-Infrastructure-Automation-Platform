---
# ==============================================================================
# ANS-01 — Baseline Server Hardening Playbook
# Implements: ANS-01 (Approved Ansible configuration stage)
#
# SECURITY CONTRACT:
#   - Run only against hosts defined in inventory/hosts.yml
#   - No user-supplied host addresses or playbook paths accepted
#   - Sensitive variables come from CI secrets (never hardcoded)
#   - any_errors_fatal: true stops the pipeline on first failure
# ==============================================================================
- name: "ANS-01 | Baseline Node Hardening"
  hosts: all
  gather_facts: true
  any_errors_fatal: true

  pre_tasks:
    - name: "STAGE | Record stage start time"
      set_fact:
        stage_started_at: "{{ ansible_date_time.iso8601 }}"
      tags: always

    - name: "STAGE | Print pipeline context"
      debug:
        msg:
          - "======================================================"
          - " ANS-01 — Baseline Server Hardening"
          - " Host:           {{ inventory_hostname }}"
          - " Deployment ID:  {{ deployment_id | default('N/A') }}"
          - " Correlation ID: {{ correlation_id | default('N/A') }}"
          - " Environment:    {{ environment | default('dev') }}"
          - " Started At:     {{ stage_started_at }}"
          - "======================================================"
      no_log: false
      tags: always

  roles:
    - role: common
      tags: [common, baseline]

  post_tasks:
    - name: "STAGE | Record stage completion"
      set_fact:
        stage_finished_at: "{{ ansible_date_time.iso8601 }}"
      tags: always

    - name: "STAGE | Print completion summary"
      debug:
        msg:
          - "======================================================"
          - " ANS-01 Completed Successfully"
          - " Host:         {{ inventory_hostname }}"
          - " Started At:   {{ stage_started_at }}"
          - " Finished At:  {{ stage_finished_at }}"
          - "======================================================"
      tags: always
